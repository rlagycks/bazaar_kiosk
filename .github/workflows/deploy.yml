# 12A1 -- deployment over ssh. Prepared, not armed:
#
#   * runs when a pull request is merged into main (a push to main), or when a
#     person triggers it by hand with a ref (rollback, re-run)
#   * runs only when the repository variable BK_DEPLOY_ENABLED is "true"
#   * uses the "production" environment, so required reviewers can be added there
#
# main is the deployment branch (D-070): work lands on develop through PRs,
# and a develop -> main PR is the release. Merging it is what deploys.
#
# Configuration comes from GitHub (D-071): every run writes the host's `.env`
# and `secrets/` from the "production" environment, then deploys. The values
# travel on ssh stdin to scripts/deploy/install_config.sh (taken from this
# workflow's own commit), never on a command line or in the log.
#
# Repository variable (job-level `if` cannot see environment variables):
#   BK_DEPLOY_ENABLED      "true" to arm; anything else keeps this a no-op
# "production" environment secrets:
#   BK_DEPLOY_HOST         hostname or IP of the deployment host
#   BK_DEPLOY_USER         ssh user that owns the checkout (docker group)
#   BK_DEPLOY_SSH_KEY      private key for that user, deploy-only, no passphrase
#   BK_DEPLOY_KNOWN_HOSTS  the host's key line(s)
#   BK_SECRET_KEY, BK_JWT_SIGNING_KEY, BK_EVENT_PASSWORD_HASH,
#   BK_POSTGRES_BOOTSTRAP_PASSWORD, BK_POSTGRES_APP_PASSWORD
#                          application secrets (scripts/deploy/init_github_secrets.sh)
# "production" environment (or repository) variables:
#   BK_DOMAIN              public hostname; required
#   BK_ALLOWED_HOSTS       default: BK_DOMAIN
#   BK_CSRF_TRUSTED_ORIGINS default: https://BK_DOMAIN
#   BK_HSTS_MAX_AGE        default: 300
#   BK_DEPLOY_DIR          checkout on the host (default /srv/bazaar_kiosk)
#
# The host does the work: scripts/deploy/deploy.sh fetches the ref, builds,
# migrates, restarts and verifies. A manual run with config_only writes the
# configuration and stops -- the first-time path, before the certificate.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 git ref (브랜치, 태그 또는 커밋). 되돌리기·재실행용. 행사 시간 중 배포 금지(D-067)."
        required: true
        default: "main"
      config_only:
        description: ".env·secrets/만 호스트에 쓰고 배포하지 않는다(첫 설정·인증서 발급 전)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.BK_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # A merge into main deploys exactly the merged commit; a manual run
      # deploys whatever ref the person named.
      DEPLOY_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
      DEPLOY_DIR: ${{ vars.BK_DEPLOY_DIR || '/srv/bazaar_kiosk' }}
      HOST: ${{ secrets.BK_DEPLOY_HOST }}
      USER: ${{ secrets.BK_DEPLOY_USER }}
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          case "$DEPLOY_REF" in
            *[!A-Za-z0-9._/-]*|"") echo "ref has characters this job does not pass through: $DEPLOY_REF"; exit 1 ;;
          esac
          case "$DEPLOY_DIR" in
            *[!A-Za-z0-9._/-]*|"") echo "BK_DEPLOY_DIR has characters this job does not pass through"; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected GITHUB_SHA"; exit 1; }
          [ -n "$HOST" ] && [ -n "$USER" ] || { echo "BK_DEPLOY_HOST / BK_DEPLOY_USER are not set"; exit 1; }

      - name: Prepare ssh
        env:
          SSH_KEY: ${{ secrets.BK_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BK_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "BK_DEPLOY_SSH_KEY / BK_DEPLOY_KNOWN_HOSTS are not set"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Write configuration on the host
        env:
          BK_DOMAIN: ${{ vars.BK_DOMAIN }}
          BK_ALLOWED_HOSTS: ${{ vars.BK_ALLOWED_HOSTS }}
          BK_CSRF_TRUSTED_ORIGINS: ${{ vars.BK_CSRF_TRUSTED_ORIGINS }}
          BK_HSTS_MAX_AGE: ${{ vars.BK_HSTS_MAX_AGE }}
          SECRET_KEY: ${{ secrets.BK_SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.BK_JWT_SIGNING_KEY }}
          EVENT_PASSWORD_HASH: ${{ secrets.BK_EVENT_PASSWORD_HASH }}
          POSTGRES_BOOTSTRAP_PASSWORD: ${{ secrets.BK_POSTGRES_BOOTSTRAP_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.BK_POSTGRES_APP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in BK_DOMAIN SECRET_KEY JWT_SIGNING_KEY EVENT_PASSWORD_HASH \
                      POSTGRES_BOOTSTRAP_PASSWORD POSTGRES_APP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "not set in the production environment:$missing"; exit 1; }

          # install_config.sh validates every value again on the host; this
          # only assembles. Nothing below is echoed.
          env_file="$(printf '%s\n' \
            "BK_DOMAIN=$BK_DOMAIN" \
            "BK_ALLOWED_HOSTS=${BK_ALLOWED_HOSTS:-$BK_DOMAIN}" \
            "BK_CSRF_TRUSTED_ORIGINS=${BK_CSRF_TRUSTED_ORIGINS:-https://$BK_DOMAIN}" \
            "BK_HSTS_MAX_AGE=${BK_HSTS_MAX_AGE:-300}" \
            "BK_CERTBOT_WEBROOT=/var/lib/bazaar_kiosk/certbot-www" \
            "BK_PROXY_INTERNAL_IP=10.89.0.10" \
            "BK_STREAM_PROBE=0")"
          item() { printf '%s %s\n' "$1" "$(printf '%s' "$2" | base64 -w0)"; }
          {
            item env "$env_file"
            item secret_key "$SECRET_KEY"
            item jwt_signing_key "$JWT_SIGNING_KEY"
            item event_password_hash "$EVENT_PASSWORD_HASH"
            item postgres_bootstrap_password "$POSTGRES_BOOTSTRAP_PASSWORD"
            item postgres_app_password "$POSTGRES_APP_PASSWORD"
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" \
                "set -euo pipefail; cd '$DEPLOY_DIR' && git fetch -q --tags origin && bash <(git show '$GITHUB_SHA:scripts/deploy/install_config.sh') \"\$PWD\""

      - name: Deploy on the host
        if: ${{ !inputs.config_only }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$HOST" \
            "cd '$DEPLOY_DIR' && bash scripts/deploy/deploy.sh --yes '$DEPLOY_REF'"
