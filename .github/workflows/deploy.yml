# 12A1 -- deployment through AWS SSM, authenticated with GitHub OIDC (D-072).
#
#   * runs when a pull request is merged into main (a push to main), or when a
#     person triggers it by hand with a ref (rollback, re-run, config only)
#   * runs only when the repository variable BK_DEPLOY_ENABLED is "true"
#   * uses the "production" environment: its secrets, its variables, and the
#     OIDC subject the IAM role trusts (repo:<owner>/<repo>:environment:production)
#
# main is the deployment branch (D-070): work lands on develop through PRs,
# and a develop -> main PR is the release. Merging it is what deploys.
#
# No ssh and no long-lived AWS key: the job assumes an IAM role through OIDC,
# stages the configuration (D-071: GitHub is the source of truth) as a
# SecureString parameter, and runs scripts/deploy/ssm_deploy.sh on the host
# with SSM Run Command. The host reads the parameter with its instance role
# and deletes it; this job deletes it again at the end whatever happened.
# Port 22 stays closed to everything but the operator.
#
# Repository variable (a job-level `if` cannot see environment variables):
#   BK_DEPLOY_ENABLED      "true" to arm; anything else keeps this a no-op
# "production" environment variables:
#   BK_AWS_ROLE_ARN        role this job assumes (trusts the OIDC subject above)
#   BK_EC2_INSTANCE_ID     the deployment host
#   BK_AWS_REGION          default: ap-northeast-2
#   BK_DOMAIN              public hostname; required
#   BK_ALLOWED_HOSTS       default: BK_DOMAIN
#   BK_CSRF_TRUSTED_ORIGINS default: https://BK_DOMAIN
#   BK_HSTS_MAX_AGE        default: 300
#   BK_DEPLOY_DIR          checkout on the host (default /srv/bazaar_kiosk)
# "production" environment secrets:
#   BK_SECRET_KEY, BK_JWT_SIGNING_KEY, BK_EVENT_PASSWORD_HASH,
#   BK_POSTGRES_BOOTSTRAP_PASSWORD, BK_POSTGRES_APP_PASSWORD

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 git ref (브랜치, 태그 또는 커밋). 되돌리기·재실행용. 행사 시간 중 배포 금지(D-067)."
        required: true
        default: "main"
      config_only:
        description: ".env·secrets/만 호스트에 쓰고 배포하지 않는다."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.BK_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      # A merge into main deploys exactly the merged commit; a manual run
      # deploys whatever ref the person named.
      DEPLOY_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
      DEPLOY_MODE: ${{ inputs.config_only && 'config-only' || 'deploy' }}
      DEPLOY_DIR: ${{ vars.BK_DEPLOY_DIR || '/srv/bazaar_kiosk' }}
      AWS_REGION: ${{ vars.BK_AWS_REGION || 'ap-northeast-2' }}
      INSTANCE_ID: ${{ vars.BK_EC2_INSTANCE_ID }}
      PARAMETER: /bazaar-kiosk/production/deploy-payload
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          case "$DEPLOY_REF" in
            *[!A-Za-z0-9._/-]*|"") echo "ref has characters this job does not pass through: $DEPLOY_REF"; exit 1 ;;
          esac
          case "$DEPLOY_DIR" in
            *[!A-Za-z0-9._/-]*|"") echo "BK_DEPLOY_DIR has characters this job does not pass through"; exit 1 ;;
          esac
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected GITHUB_SHA"; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "BK_EC2_INSTANCE_ID is not set or malformed"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || { echo "BK_AWS_REGION is malformed"; exit 1; }

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BK_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bazaar-kiosk-deploy-${{ github.run_id }}

      - name: Stage configuration
        env:
          BK_DOMAIN: ${{ vars.BK_DOMAIN }}
          BK_ALLOWED_HOSTS: ${{ vars.BK_ALLOWED_HOSTS }}
          BK_CSRF_TRUSTED_ORIGINS: ${{ vars.BK_CSRF_TRUSTED_ORIGINS }}
          BK_HSTS_MAX_AGE: ${{ vars.BK_HSTS_MAX_AGE }}
          SECRET_KEY: ${{ secrets.BK_SECRET_KEY }}
          JWT_SIGNING_KEY: ${{ secrets.BK_JWT_SIGNING_KEY }}
          EVENT_PASSWORD_HASH: ${{ secrets.BK_EVENT_PASSWORD_HASH }}
          POSTGRES_BOOTSTRAP_PASSWORD: ${{ secrets.BK_POSTGRES_BOOTSTRAP_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.BK_POSTGRES_APP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in BK_DOMAIN SECRET_KEY JWT_SIGNING_KEY EVENT_PASSWORD_HASH \
                      POSTGRES_BOOTSTRAP_PASSWORD POSTGRES_APP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "not set in the production environment:$missing"; exit 1; }

          # install_config.sh validates every value again on the host; this
          # only assembles. Nothing below is echoed, and the value reaches the
          # AWS CLI as a file (file://), never as an argument.
          env_file="$(printf '%s\n' \
            "BK_DOMAIN=$BK_DOMAIN" \
            "BK_ALLOWED_HOSTS=${BK_ALLOWED_HOSTS:-$BK_DOMAIN}" \
            "BK_CSRF_TRUSTED_ORIGINS=${BK_CSRF_TRUSTED_ORIGINS:-https://$BK_DOMAIN}" \
            "BK_HSTS_MAX_AGE=${BK_HSTS_MAX_AGE:-300}" \
            "BK_CERTBOT_WEBROOT=/var/lib/bazaar_kiosk/certbot-www" \
            "BK_PROXY_INTERNAL_IP=10.89.0.10" \
            "BK_STREAM_PROBE=0")"
          item() { printf '%s %s\n' "$1" "$(printf '%s' "$2" | base64 -w0)"; }
          umask 077
          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          {
            item env "$env_file"
            item secret_key "$SECRET_KEY"
            item jwt_signing_key "$JWT_SIGNING_KEY"
            item event_password_hash "$EVENT_PASSWORD_HASH"
            item postgres_bootstrap_password "$POSTGRES_BOOTSTRAP_PASSWORD"
            item postgres_app_password "$POSTGRES_APP_PASSWORD"
          } > "$payload_file"
          aws ssm put-parameter --name "$PARAMETER" --type SecureString --overwrite \
            --value "file://$payload_file" >/dev/null
          echo "staged $PARAMETER"

      - name: Run on the host (SSM)
        run: |
          set -euo pipefail
          # Every value interpolated here was checked in "Check inputs".
          host_cmd="runuser -l ec2-user -c \"cd '$DEPLOY_DIR' && git fetch -q --tags origin && bash <(git show '$GITHUB_SHA:scripts/deploy/ssm_deploy.sh') '$DEPLOY_DIR' '$GITHUB_SHA' '$DEPLOY_REF' '$DEPLOY_MODE' '$AWS_REGION'\""
          params="$(jq -n --arg c "$host_cmd" '{commands: [$c], executionTimeout: ["1500"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "bazaar-kiosk $DEPLOY_MODE $DEPLOY_REF (run $GITHUB_RUN_ID)" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command $command_id"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 80
          echo "--- stderr"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -n 40
          echo "status: $status"
          [ "$status" = "Success" ]

      - name: Remove staged configuration
        if: always()
        run: aws ssm delete-parameter --name "$PARAMETER" >/dev/null 2>&1 || true
