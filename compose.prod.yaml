# Deployment candidate (4A3, D-046). Running this is a separate approval: the
# real host, TLS certificate, backups and observability belong to 12A1/12A2.
#
# Secrets are files, never values in this file or in the environment (D-046).
# Create them outside the repository, readable only by the deploying user:
#
#   umask 077; mkdir -p ./secrets
#   python -c "import secrets;print(secrets.token_urlsafe(64))" > ./secrets/secret_key
#   python -c "import secrets;print(secrets.token_urlsafe(64))" > ./secrets/jwt_signing_key
#   # role accounts JSON and the database URL: see docs/modernization/DEPLOYMENT_CANDIDATE.md
#
# Only the proxy is published. The database and the application server are
# reachable on the internal network alone (BK-R044).
services:
  postgres:
    image: postgres:15-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      # The application role's password, read by the init script below.
      BK_APP_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_bootstrap_password
      - postgres_app_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/pg_prod_init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar_bootstrap -d bazaar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    labels:
      org.bazaar-kiosk.purpose: deployment-candidate

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      DEBUG: "0"
      # Hostnames and origins are configuration, not secrets: set them for the
      # real host before starting. The placeholders refuse to start as-is.
      ALLOWED_HOSTS: ${BK_ALLOWED_HOSTS:?set the deployment hostname}
      CSRF_TRUSTED_ORIGINS: ${BK_CSRF_TRUSTED_ORIGINS:?set the https origin}
      SECRET_KEY_FILE: /run/secrets/secret_key
      JWT_SIGNING_KEY_FILE: /run/secrets/jwt_signing_key
      EVENT_PASSWORD_HASH_FILE: /run/secrets/event_password_hash
      DATABASE_URL_FILE: /run/secrets/database_url
      # Issue #61: the server fills REMOTE_ADDR from the socket peer, which
      # behind this proxy is always the proxy. Without naming the proxy here,
      # every login failure in the world lands in one bucket and ten of them
      # lock out every device on a shared account. The application reads
      # X-Forwarded-For only from this address.
      TRUSTED_PROXY_IPS: ${BK_PROXY_INTERNAL_IP:-10.89.0.10}
      # 10A: the synthetic stream used to measure this stack. Off unless a
      # measurement run asks for it, and it stays off in a real deployment --
      # it is an instrument, and the kitchen's own SSE endpoint is 10D1.
      BK_STREAM_PROBE: ${BK_STREAM_PROBE:-0}
    secrets:
      - secret_key
      - jwt_signing_key
      - event_password_hash
      - database_url
    # 10A: ASGI, because a WSGI worker collects a streaming response and sends
    # it as one body -- SSE cannot exist on this stack otherwise. uvicorn runs
    # its own workers: `uvicorn.workers` is deprecated upstream and its
    # replacement package is alpha and a year without a release, so putting
    # gunicorn in front would mean depending on the least maintained piece.
    #
    # --no-proxy-headers is the load-bearing flag. uvicorn's proxy handling is
    # ON by default and, unlike gunicorn's, it *rewrites the client address*
    # from X-Forwarded-For. Leaving it on would move the issue #61 boundary
    # out of TRUSTED_PROXY_IPS and into this command line without anything
    # saying so. The forwarded scheme is not affected: Django reads
    # X-Forwarded-Proto itself through SECURE_PROXY_SSL_HEADER.
    #
    # --timeout-graceful-shutdown bounds a restart. Without it uvicorn waits
    # for open connections to close, and a stream is a connection that has no
    # reason to.
    #
    # `manage.py check` runs first because uvicorn does not. The system check
    # that refuses a synchronous middleware (orders.E001) is the guard this
    # whole runtime rests on, and without this line it would only ever run in
    # CI -- a hotfix to MIDDLEWARE that skipped CI would start a worker whose
    # request path is no longer async, with nothing failing (PR #76 review).
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py check
        exec python -m uvicorn bazaar_kiosk.asgi:application \
          --host 0.0.0.0 --port 8000 \
          --workers 3 \
          --no-proxy-headers \
          --timeout-graceful-shutdown 10 \
          --log-level info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    labels:
      org.bazaar-kiosk.purpose: deployment-candidate

  proxy:
    # 10A: built rather than pulled, because it carries this build's static
    # files. The nginx image and the configuration are in the Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    ports:
      # TLS termination and the certificate are 12A1. This candidate publishes
      # plain HTTP so the header boundary can be exercised before then; it is
      # not the public listener.
      - "127.0.0.1:8080:80"
    depends_on:
      - app
    networks:
      # The only service on both: it takes traffic from the host and reaches the
      # application over the internal network, which has no route out.
      edge: {}
      internal:
        # Fixed so the application can name exactly this address as the only
        # peer allowed to set a forwarded client address. A container address
        # assigned at random would force a wider range, which would include the
        # application container itself.
        ipv4_address: 10.89.0.10
    restart: unless-stopped
    labels:
      org.bazaar-kiosk.purpose: deployment-candidate

networks:
  edge: {}
  internal:
    # No route out of this network for the services on it. The proxy publishes
    # a port on the host; the database and application do not.
    internal: true
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  pg_data:
    labels:
      org.bazaar-kiosk.purpose: deployment-candidate

secrets:
  secret_key:
    file: ./secrets/secret_key
  jwt_signing_key:
    file: ./secrets/jwt_signing_key
  event_password_hash:
    file: ./secrets/event_password_hash
  database_url:
    file: ./secrets/database_url
  postgres_bootstrap_password:
    file: ./secrets/postgres_bootstrap_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
