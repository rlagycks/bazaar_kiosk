{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>판매 통계 대시보드</title>
  <link rel="stylesheet" href="{% static 'orders/ui/styles.css' %}">
  <style>
    body{background:#f3f4f6;}
    .wrap{max-width:1240px;margin:0 auto;padding:16px;}
    .hdr{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
    .hdr h2{margin:0;font-size:24px;}
    .muted{color:#6b7280;font-size:14px;}
    .grid-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;}
    .summary-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;}
    .summary-card h3{margin:0;font-size:15px;color:#6b7280;}
    .summary-value{font-size:26px;font-weight:700;color:#111827;}
    .layout{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
    @media (max-width:980px){.layout{grid-template-columns:1fr;}}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;}
    .panel h3{margin:0 0 12px 0;font-size:18px;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px;}
    th{background:#f9fafb;font-weight:600;}
    .text-right{text-align:right;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;}
    .chip{background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 12px;font-weight:600;}
    .ratio-bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px;}
    .ratio-fill{height:100%;background:#2563eb;}
    .period-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
    .period-form label{font-size:14px;color:#374151;}
    .period-form input{min-height:36px;padding:4px 8px;border:1px solid #9ca3af;border-radius:6px;}
    .period-form button{min-height:36px;padding:4px 12px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;}
    .period-form button[type=button]{background:#fff;color:#2563eb;}
    .sub-figures{margin-top:6px;font-size:13px;color:#6b7280;}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <h2>판매 통계 대시보드</h2>
      <div class="muted" id="periodLabel">불러오는 중</div>
      <form class="period-form" id="periodForm">
        <label>시작 <input type="date" id="periodStart" name="start_date"></label>
        <label>끝 <input type="date" id="periodEnd" name="end_date"></label>
        <button type="submit">조회</button>
        <button type="button" id="periodReset">기본 기간</button>
      </form>
    </header>
{% include "orders/_practice_banner.html" %}

    <section class="grid-summary">
      <div class="summary-card">
        <h3>총 주문 수</h3>
        <div class="summary-value" id="summaryOrders">0건</div>
      </div>
      <div class="summary-card">
        <h3>총 판매 수량</h3>
        <div class="summary-value" id="summaryItems">0개</div>
      </div>
      <div class="summary-card">
        <h3>총 매출</h3>
        <div class="summary-value" id="summaryRevenue">₩0</div>
        <div class="sub-figures" id="summaryAside"></div>
      </div>
      <div class="summary-card">
        <h3>결제 비율 (현금/티켓)</h3>
        <div class="chips" id="paymentChips"></div>
        <div class="ratio-bar">
          <div class="ratio-fill" id="paymentRatioFill" style="width:0%;"></div>
        </div>
        <div class="sub-figures" id="paymentAside"></div>
      </div>
    </section>

    <div class="layout">
      <section class="panel">
        <h3>메뉴별 판매 현황</h3>
        <table>
          <thead>
            <tr>
              <th>메뉴</th>
              <th class="text-right">판매 수량</th>
              <th class="text-right">매출</th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
            <tr><td colspan="3" class="muted">데이터 없음</td></tr>
          </tbody>
        </table>
      </section>

      <aside class="panel">
        <h3>시간대별 매출</h3>
        <table>
          <thead>
            <tr>
              <th>시간</th>
              <th class="text-right">주문 수</th>
              <th class="text-right">매출</th>
            </tr>
          </thead>
          <tbody id="hourlyTableBody">
            <tr><td colspan="3" class="muted">데이터 없음</td></tr>
          </tbody>
        </table>
      </aside>
    </div>
  </div>

  <script src="{% static 'orders/ui/auth.js' %}" data-auth-account="{{ request.auth_account.id }}" data-auth-session="{{ request.auth_session_id }}"></script>
  <script src="{% static 'orders/ui/dom.js' %}"></script>
  <script>
    const KRW = n => (Number(n)||0).toLocaleString('ko-KR');
    async function getJSON(url){
      const r = await window.BazaarAuth.fetch(url,{credentials:'same-origin'});
      if(!r.ok){
        const text = await r.text().catch(()=> '');
        throw new Error(text || ('HTTP '+r.status));
      }
      return r.json();
    }

    const DOM = window.BazaarDom;

    function emptyRow(){
      return DOM.el('tr', {}, DOM.el('td', {class:'muted', text:'데이터 없음', attrs:{colspan:'3'}}));
    }

    function renderSummary(summary){
      document.getElementById('summaryOrders').textContent = (summary.orders||0) + '건';
      document.getElementById('summaryItems').textContent = (summary.items||0) + '개';
      document.getElementById('summaryRevenue').textContent = '₩' + KRW(summary.revenue||0);
      // 8C: cancelled orders leave the figures; say how many did. Rows from
      // before the split payment fields were interpreted, not rewritten.
      const aside = [];
      if(summary.cancelled_orders) aside.push('취소 ' + summary.cancelled_orders + '건 제외');
      if(summary.legacy_unsplit_orders) aside.push('구형 수납 기록 ' + summary.legacy_unsplit_orders + '건 해석');
      document.getElementById('summaryAside').textContent = aside.join(' · ');
    }

    function renderPayment(payment){
      const chips = document.getElementById('paymentChips');
      const ratioFill = document.getElementById('paymentRatioFill');
      const total = (payment.cash||0) + (payment.ticket||0);
      const cashPercent = total ? Math.round((payment.cash||0)/total*100) : 0;
      const ticketPercent = 100 - cashPercent;
      DOM.render(chips, [
        DOM.el('span', {class:'chip', text:'현금 ₩' + KRW(payment.cash||0) + ' (' + cashPercent + '%)'}),
        DOM.el('span', {class:'chip', text:'티켓 ₩' + KRW(payment.ticket||0) + ' (' + ticketPercent + '%)'}),
      ]);
      ratioFill.style.width = cashPercent + '%';
    }

    function renderPaymentAside(payment){
      // Cash received minus change given back is what the till actually holds.
      document.getElementById('paymentAside').textContent =
        '거스름돈 ₩' + KRW(payment.change||0) + ' · 순현금 ₩' + KRW(payment.net_cash||0);
    }

    function renderMenu(menu){
      const body = document.getElementById('menuTableBody');
      if(!menu.length){
        DOM.render(body, emptyRow());
        return;
      }
      // The menu name is operator input and lands here as text, never markup.
      DOM.render(body, menu.map(row => DOM.el('tr', {}, [
        DOM.el('td', {text: row.name}),
        DOM.el('td', {class:'text-right', text: KRW(row.qty||0)}),
        DOM.el('td', {class:'text-right', text: '₩' + KRW(row.amount||0)}),
      ])));
    }

    function renderHourly(hourly){
      const body = document.getElementById('hourlyTableBody');
      if(!hourly.length){
        DOM.render(body, emptyRow());
        return;
      }
      DOM.render(body, hourly.map(row => DOM.el('tr', {}, [
        DOM.el('td', {text: row.hour || '-'}),
        DOM.el('td', {class:'text-right', text: row.orders||0}),
        DOM.el('td', {class:'text-right', text: '₩' + KRW(row.revenue||0)}),
      ])));
    }

    const BASIS_LABEL = {event_day: '행사일', today: '오늘', explicit: '선택 기간'};

    function periodLabel(period){
      const days = period.start_date === period.end_date
        ? period.start_date : period.start_date + ' ~ ' + period.end_date;
      const parts = [(BASIS_LABEL[period.basis] || '') + ' ' + days];
      if(period.label) parts.push(period.label);
      if(period.floor) parts.push('층: ' + period.floor);
      return parts.join(' · ') + ' 기준';
    }

    async function loadDashboard(params){
      const url = new URL("{% url 'orders:stats-dashboard' %}", window.location.href);
      Object.entries(params || {}).forEach(([key, value]) => { if(value) url.searchParams.set(key, value); });
      try{
        const data = await getJSON(url.toString());
        const period = data.period || {};
        document.getElementById('periodLabel').textContent = periodLabel(period);
        document.getElementById('periodStart').value = period.start_date || '';
        document.getElementById('periodEnd').value = period.end_date || '';
        renderSummary(data.summary || {});
        renderPayment(data.payment || {});
        renderPaymentAside(data.payment || {});
        renderMenu(data.menu || []);
        renderHourly(data.hourly || []);
      }catch(e){
        // The server's refusal is a plain sentence (bad date, inverted range).
        document.getElementById('periodLabel').textContent = '통계를 불러오지 못했습니다: ' + (e.message || e);
      }
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      loadDashboard();
      document.getElementById('periodForm').addEventListener('submit', (event)=>{
        event.preventDefault();
        loadDashboard({
          start_date: document.getElementById('periodStart').value,
          end_date: document.getElementById('periodEnd').value,
        });
      });
      document.getElementById('periodReset').addEventListener('click', ()=> loadDashboard());
    });
  </script>
</body>
</html>
