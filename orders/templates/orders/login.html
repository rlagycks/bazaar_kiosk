{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>바자회 로그인</title>
  <link rel="stylesheet" href="{% static 'orders/ui/styles.css' %}">
  <style>
    .account-page { max-width: 440px; margin: 8vh auto; padding: 20px; }
    .account-panel { padding: 24px; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; }
    .account-panel h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .account-panel p { color: #4b5563; line-height: 1.5; }
    .account-panel label { display: block; margin: 20px 0 8px; font-weight: 600; }
    .account-panel input { box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #9ca3af; border-radius: 8px; font-size: 16px; }
    .account-panel button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .account-panel .login-error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="account-page">
    <form class="account-panel" method="post" action="{% url 'orders:login' %}">
      {% csrf_token %}
      <h1>바자회 로그인</h1>
      <p>담당 계정으로 로그인하면 업무 화면으로 이동합니다.</p>
      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label for="accountId">아이디</label>
      <input id="accountId" name="account_id" type="text" maxlength="128" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="accountPassword">비밀번호</label>
      <input id="accountPassword" name="password" type="password" maxlength="1024" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
