{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>바자회 로그인</title>
  <link rel="stylesheet" href="{% static 'orders/ui/ui05.css' %}">
  <link rel="stylesheet" href="{% static 'orders/ui/account.css' %}">
</head>
<body class="ui05 login-page">
  <main class="login-main">
    <p class="login-brand">BAZAAR</p>
    <h1 class="login-title">바자회 로그인</h1>
    <p class="login-intro">등록된 이름과 행사 비밀번호로 맡은 업무를 시작하세요</p>
    <form class="login-form" method="post" action="{% url 'orders:login' %}">
      {% csrf_token %}
      {% if error %}<p id="login-error" class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label for="accountName">이름</label>
      <input id="accountName" name="name" type="text" maxlength="50" autocomplete="username" spellcheck="false" required autofocus{% if error %} aria-describedby="login-error"{% endif %}>
      <label for="accountPassword">행사 비밀번호</label>
      <input id="accountPassword" name="password" type="password" maxlength="1024" autocomplete="current-password" required{% if error %} aria-describedby="login-error"{% endif %}>
      <button class="login-submit" type="submit">로그인</button>
    </form>
    <p class="login-help">이름 등록과 권한 변경은 관리자에게 문의하세요</p>
  </main>
</body>
</html>
