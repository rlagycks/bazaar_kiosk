{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>주문·서빙 | 바자회</title>
  <link rel="stylesheet" href="{% static 'orders/ui/ui05.css' %}">
  <link rel="stylesheet" href="{% static 'orders/ui/account.css' %}">
  <link rel="stylesheet" href="{% static 'orders/ui/order.css' %}">
</head>
<body class="ui05">
  <main class="serving-page" id="order-page" data-menu-url="{% url 'orders:menus' %}" data-order-url="{% url 'orders:orders-collection' %}">
    <header class="serving-header">
      <h1>서빙 · {{ account_name }}</h1>
      <button type="button" class="ui-button" data-account-menu-open aria-haspopup="dialog" aria-controls="account-menu">내 메뉴</button>
    </header>
    {% include 'orders/_practice_banner.html' %}
    <nav class="menu-tabs" id="menu-tabs" aria-label="담을 메뉴의 홀·포장 구분">
      <button type="button" class="ui-button menu-tab" data-mode="DINE_IN" aria-pressed="true">홀 0개</button>
      <button type="button" class="ui-button menu-tab" data-mode="TAKEOUT" aria-pressed="false">포장 0개</button>
    </nav>
    <p id="mode-hint">홀 · 수량을 선택한 뒤 담아 주세요</p>
    <p id="order-notice" role="status" aria-live="polite"></p>
    <section id="menu-grid" class="menu-grid" aria-label="메뉴 목록" aria-busy="true"><p class="ui-muted">메뉴를 불러오는 중입니다.</p></section>
    <noscript><p class="ui-error">주문하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
  </main>
  <footer class="serving-footer">
    <p id="order-summary" class="ui-muted" aria-live="polite">홀 0개 · 포장 0개 / 총 0원</p>
    <button id="btn-checkout" type="button" class="ui-button ui-button-primary" aria-haspopup="dialog" aria-controls="checkout" disabled>결제하기</button>
  </footer>
  <dialog id="checkout" class="checkout" aria-labelledby="checkout-title">
    <header class="checkout-header">
      <h2 id="checkout-title">주문 확인 · 결제</h2>
      <button type="button" id="btn-back" class="ui-button">돌아가기</button>
    </header>
    <div class="checkout-body">
      <label class="field" for="table-number">테이블 번호
        <input id="table-number" inputmode="numeric" maxlength="6" placeholder="예) 12" aria-describedby="table-help" autocomplete="off">
      </label>
      <h2 class="cart-title" id="cart-title">담은 메뉴 · 0개</h2>
      <div id="cart-items" class="order-items"></div>
      <p id="table-help" class="ui-muted">포장만 주문할 때는 101–120번</p>
      <fieldset class="payment-methods">
        <legend class="sr-only">결제 수단</legend>
        <label><input type="radio" name="pay" value="CASH" checked><span class="ui-button">현금</span></label>
        <label><input type="radio" name="pay" value="TICKET"><span class="ui-button">식권</span></label>
        <label><input type="radio" name="pay" value="CASH_TICKET"><span class="ui-button">혼합</span></label>
      </fieldset>
      <label id="single-amount-row" class="field" for="cash-in"><span id="single-amount-label">받은 현금</span>
        <input id="cash-in" inputmode="numeric" maxlength="24" placeholder="예) 15000" autocomplete="off">
      </label>
      <div id="mixed-amount-row" hidden>
        <label class="field" for="cash-mixed">받은 현금<input id="cash-mixed" inputmode="numeric" maxlength="24" placeholder="예) 10000" autocomplete="off"></label>
        <label class="field" for="ticket-mixed">받은 식권 금액<input id="ticket-mixed" inputmode="numeric" maxlength="24" placeholder="예) 5000" autocomplete="off"></label>
      </div>
      <div class="settlement" aria-live="polite">
        <strong>거스름돈 <span id="change-amount">0원</span></strong>
        <p class="ui-muted">주문 금액 <span id="total-amount">0원</span></p>
        <p id="payment-error" class="ui-error"></p>
      </div>
      <button type="button" id="btn-reset" class="ui-button reset-order">주문 비우기</button>
    </div>
    <footer class="checkout-footer">
      <p id="save-error" class="ui-error" role="alert" tabindex="-1"></p>
      <button type="button" id="btn-submit" class="ui-button ui-button-primary" disabled>주문 저장</button>
      <p class="ui-muted">결제 내용을 확인한 뒤 저장해 주세요.</p>
    </footer>
  </dialog>
  {% include 'orders/_account_menu.html' %}
  <script src="{% static 'orders/ui/auth.js' %}" data-auth-account="{{ request.auth_account.id }}" data-auth-session="{{ request.auth_session_id }}"></script>
  <script src="{% static 'orders/ui/dom.js' %}"></script>
  <script src="{% static 'orders/ui/request_id.js' %}"></script>
  <script src="{% static 'orders/ui/order_state.js' %}"></script>
  <script src="{% static 'orders/ui/order.js' %}"></script>
  <script src="{% static 'orders/ui/account_menu.js' %}"></script>
</body>
</html>
