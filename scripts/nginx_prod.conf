# Deployment candidate proxy (4A3, 10A). TLS termination, the certificate and
# the real server_name are 12A1; this file carries the header boundary, the
# static files and the streaming path.
#
# The forwarded headers live in nginx_proxy_headers.conf and are included by
# every location that proxies. That is not tidiness: nginx drops every
# inherited `proxy_set_header` from a location that declares one of its own,
# so a server-level block plus one extra header in a location is how Host and
# X-Forwarded-For disappear without a word.
server {
    listen 80;
    server_name _;

    # Orders are small; a large body is never a legitimate request here.
    client_max_body_size 1m;

    # 10A: static files are served here, not by the application. The build put
    # them in this image (see Dockerfile, target `proxy`), so they always match
    # the manifest the templates were rendered against.
    #
    # Two locations because the lifetime differs. `collectstatic` writes both a
    # hashed copy of every file and the original name; only the hashed one can
    # be cached forever, because only its name changes when the content does.
    # This is what WhiteNoise decided per file before 10A moved the job here.
    root /usr/share/nginx/html;

    # The manifest maps original names to hashed ones. Django reads it from
    # disk in the application container; nothing fetches it over HTTP, so
    # publishing a list of every asset name buys nobody anything.
    location = /static/staticfiles.json {
        return 404;
    }

    # name.<12 hex>.ext, and the .gz sibling of the same.
    location ~ "^/static/.+\.[0-9a-f]{12}\.[^./]+(\.gz)?$" {
        include /etc/nginx/bk_static_headers.conf;
        gzip_static on;
        # One Cache-Control, not `expires` plus an add_header: nginx emits both
        # and the client sees two header lines saying different things.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        include /etc/nginx/bk_static_headers.conf;
        gzip_static on;
        # What WhiteNoise gave an unhashed file before 10A moved the job here.
        add_header Cache-Control "public, max-age=60";
    }

    # 10A: the streaming path. Everything here is about not holding frames.
    # nginx buffers a proxied response by default, which would collect an
    # entire stream and deliver it at the end -- a working ASGI runtime would
    # look exactly like the WSGI one it replaced.
    location /orders/api/stream/ {
        include /etc/nginx/bk_proxy_headers.conf;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        # An SSE response is chunked and open-ended; a "Connection: close"
        # inherited from the client would end it after the first frame.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # A stream is idle between frames by design. The default read timeout
        # would drop a kitchen display between two quiet minutes. The heartbeat
        # interval that has to stay under this is 10D1's (D-010).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        include /etc/nginx/bk_proxy_headers.conf;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
