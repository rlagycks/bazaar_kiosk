# Deployment candidate proxy (4A3, D-046). TLS termination, the certificate and
# the real server_name are 12A1; this file carries the header boundary only.
server {
    listen 80;
    server_name _;

    # The client address the application throttles on. $remote_addr is the peer
    # nginx actually accepted the connection from, never a header the client
    # sent, so an inbound X-Forwarded-For is replaced rather than appended to.
    # The application believes this header only from TRUSTED_PROXY_IPS
    # (issue #61); gunicorn itself never rewrites the client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # An inbound X-Forwarded-For from the internet must not survive to the
    # application: it would let a client choose which throttle bucket it lands
    # in. $remote_addr above already replaces it; this makes the intent explicit
    # for any header added later.
    proxy_set_header X-Real-IP $remote_addr;

    # Orders are small; a large body is never a legitimate request here.
    client_max_body_size 1m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
