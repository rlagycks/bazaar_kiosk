# What every proxied location must send upstream (4A3, 10A).
#
# This is a separate file because of how nginx inherits `proxy_set_header`:
# a location that declares **any** one of them stops inheriting **all** of the
# ones above it. Writing them at server level and adding a single header
# inside a location silently drops Host, X-Forwarded-For and
# X-Forwarded-Proto for that location -- which is a 400 from ALLOWED_HOSTS if
# you are lucky, and the issue #61 throttle boundary quietly gone if you are
# not. The first draft of the streaming location did exactly this and the
# measurement run caught it.
#
# So: no `proxy_set_header` at server level, and every proxied location
# includes this file.

# The client address the application throttles on. $remote_addr is the peer
# nginx actually accepted the connection from, never a header the client sent,
# so an inbound X-Forwarded-For is replaced rather than appended to. The
# application believes this header only from TRUSTED_PROXY_IPS (issue #61);
# the application server itself never rewrites the client address, because
# uvicorn's proxy-header handling -- which would -- is switched off in
# compose.prod.yaml.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;

# An inbound X-Forwarded-For from the internet must not survive to the
# application: it would let a client choose which throttle bucket it lands in.
# $remote_addr above already replaces it; this makes the intent explicit for
# any header added later.
proxy_set_header X-Real-IP $remote_addr;
