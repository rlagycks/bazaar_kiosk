# What Django's SecurityMiddleware used to add to a static response (10A).
#
# Before 10A, WhiteNoise served /static/ from inside the middleware chain, so
# every asset came back through `SecurityMiddleware.process_response` and wore
# these three headers. Moving the files to the proxy moved them out of that
# chain: without this file they would silently stop wearing them, which is the
# kind of side effect the card warns about when it forbids removing middleware
# to make a runtime look async.
#
# Separate file for the same reason as the proxy headers: nginx stops
# inheriting *all* `add_header` directives into a location that declares one of
# its own, and both static locations declare Cache-Control.
#
# X-Frame-Options is deliberately absent: WhiteNoise answered before
# XFrameOptionsMiddleware, so static responses never carried it either.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
